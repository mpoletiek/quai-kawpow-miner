[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/mpoletiek/quai-kawpow-miner"

[workspace.dependencies]
rsq-pow = { git = "https://github.com/mpoletiek/rs-quai.git", branch = "main" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
