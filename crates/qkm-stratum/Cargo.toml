[package]
name = "qkm-stratum"
description = "Stratum client for KawPoW on Quai nodes (rs-quai and go-quai), with reconnect and failover, plus a mock pool for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json = "1"
qkm-core = { path = "../qkm-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
