[package]
name = "quai-kawpow-miner"
description = "KawPoW GPU miner for Quai Network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
qkm-core = { path = "../qkm-core" }
qkm-cuda = { path = "../qkm-cuda" }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cuda-13020", "dynamic-loading"] }
clap = { version = "4", features = ["derive"] }
qkm-stratum = { path = "../qkm-stratum" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
nvml-wrapper = "0.13"
ctrlc = { version = "3", features = ["termination"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
